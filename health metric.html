  <div class="card">
    <h2>Comprehensive Health Tracker</h2>
    <input type="number" id="age" placeholder="Age (years)">
    <input type="number" id="height" placeholder="Height (cm)">
    <input type="number" id="weight" placeholder="Weight (kg)">
    <input type="number" id="heartRate" placeholder="Heart Rate (BPM)">
    <input type="number" id="steps" placeholder="Daily Steps">
    <input type="number" id="sleep" placeholder="Sleep Hours">
    <input type="number" id="calories" placeholder="Calories Consumed">
    <input type="number" id="water" placeholder="Water Intake (ml)">
    <input type="number" id="stepGoal" placeholder="Daily Step Goal">
    <input type="number" id="calorieGoal" placeholder="Daily Calorie Goal">
    
    <button onclick="checkHealth()">Analyze Health</button>
    <div class="result" id="resultBox">

      
    </div>
  </div>

  <script>
    function checkHealth() {
      // Basic metrics
      const age = parseInt(document.getElementById('age').value);
      const height = parseFloat(document.getElementById('height').value) / 100;
      const weight = parseFloat(document.getElementById('weight').value);
      const heartRate = parseInt(document.getElementById('heartRate').value);
      
      // Activity metrics
      const steps = parseInt(document.getElementById('steps').value);
      const sleep = parseFloat(document.getElementById('sleep').value);
      const calories = parseInt(document.getElementById('calories').value);
      const water = parseInt(document.getElementById('water').value);
      
      // Goals
      const stepGoal = parseInt(document.getElementById('stepGoal').value);
      const calorieGoal = parseInt(document.getElementById('calorieGoal').value);

      const resultBox = document.getElementById('resultBox');

      // Validate all inputs
      if ([age, height, weight, heartRate, steps, sleep, calories, water, stepGoal, calorieGoal].some(v => !v)) {
        resultBox.textContent = "Please fill in all fields correctly.";
        return;
      }

      // BMI Calculation
      const bmi = weight / (height * height);
      let bmiStatus = "";
      if (bmi < 18.5) bmiStatus = "Underweight";
      else if (bmi < 25) bmiStatus = "Normal";
      else if (bmi < 30) bmiStatus = "Overweight";
      else bmiStatus = "Obese";

      // Heart Rate Analysis
      let hrStatus = "";
      if (heartRate < 60) hrStatus = "Low (Bradycardia)";
      else if (heartRate <= 100) hrStatus = "Normal";
      else hrStatus = "High (Tachycardia)";

      // Activity Analysis
      const stepDiff = steps - stepGoal;
      const calorieDiff = calories - calorieGoal;
      const waterStatus = water >= 2000 ? "Adequate" : "Inadequate";

      // Sleep Analysis
      let sleepStatus = "";
      if (sleep < 7) sleepStatus = "Insufficient";
      else if (sleep <= 9) sleepStatus = "Adequate";
      else sleepStatus = "Excessive";

      // Calculate Health Score
      let bmiScore = bmiStatus === "Normal" ? 20 : 
                    (bmiStatus === "Underweight" || bmiStatus === "Overweight") ? 10 : 5;
      
      let hrScore = hrStatus === "Normal" ? 15 : 5;
      
      let sleepScore = sleepStatus === "Adequate" ? 15 : 5;
      
      let stepsScore = steps >= stepGoal ? 20 : (steps / stepGoal) * 20;
      stepsScore = Math.round(stepsScore * 10) / 10;
      
      let calorieScore = Math.abs(calorieDiff) <= 0.1 * calorieGoal ? 20 : 10;
      
      let waterScore = water >= 2000 ? 10 : (water / 2000) * 10;
      waterScore = Math.round(waterScore * 10) / 10;

      const totalScore = bmiScore + hrScore + sleepScore + stepsScore + calorieScore + waterScore;
      const roundedTotal = Math.round(totalScore);

      let rating;
      if (roundedTotal >= 90) rating = "Excellent";
      else if (roundedTotal >= 75) rating = "Good";
      else if (roundedTotal >= 50) rating = "Fair";
      else rating = "Poor";

      // Compile results
      resultBox.innerHTML = `
        <strong>Health Analysis:</strong><br>
        • BMI: ${bmi.toFixed(1)} (${bmiStatus})<br>
        • Heart Rate: ${heartRate} BPM (${hrStatus})<br>
        • Sleep: ${sleep} hrs (${sleepStatus})<br>
        • Steps: ${steps} (${stepDiff >= 0 ? 'Met' : 'Missed'} goal by ${Math.abs(stepDiff)} steps)<br>
        • Calories: ${calories} kcal (${calorieDiff >= 0 ? 'Exceeded' : 'Under'} by ${Math.abs(calorieDiff)} kcal)<br>
        • Hydration: ${water} ml (${waterStatus})<br>
        • Health Score: ${roundedTotal}/100 (${rating})<br><br>
        
        <strong>Recommendations:</strong><br>
        ${generateRecommendations(bmiStatus, hrStatus, sleepStatus, stepDiff, calorieDiff, waterStatus)}
      `;
    }

    function generateRecommendations(bmi, hr, sleep, stepDiff, calorieDiff, water) {
      let recommendations = [];
      
      if (bmi !== "Normal") recommendations.push("Maintain a balanced diet and regular exercise routine");
      if (hr !== "Normal") recommendations.push("Consult a healthcare professional about your heart rate");
      if (sleep === "Insufficient") recommendations.push("Aim for 7-9 hours of quality sleep nightly");
      if (sleep === "Excessive") recommendations.push("Consider discussing sleep patterns with a doctor");
      if (stepDiff < 0) recommendations.push("Try to incorporate more walking into your daily routine");
      if (Math.abs(calorieDiff) > 0.1 * (calorieDiff + calorieGoal)) recommendations.push("Consider balancing calorie intake with physical activity");
      if (water === "Inadequate") recommendations.push("Increase water intake to at least 2 liters daily");

      return recommendations.length > 0 
        ? recommendations.join('<br>• ') 
        : "Great job! You're meeting all health targets!";
    }
