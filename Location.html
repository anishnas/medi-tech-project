  <h1 style="text-align:center;">Nearest Hospitals</h1>

  <!-- 🔵 Legend section -->
  <div class="legend">
    <div class="legend-item">
      <img src="https://www.freeiconspng.com/uploads/blue-location-icon-png-19.png" alt="Current Location" />
      <span class="legend-label">Current Location</span>
    </div>
    <div class="legend-item">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdGu04axn9vlZ-abhl8Vxpj4nxb7Q0-aTc0A&s" alt="Hospital Location" />

    </div>
  </div>

  <!-- 🔹 Your Location label -->
  <div id="yourLocationText">Your Location</div>

  <!-- 🔹 Locate button -->
  <button id="locateBtn" title="Show My Location">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRK-qe2f-oIhoDNXn7pNCIxeR9UIZE0NwxOHrPwxXl2YaRFs4t07BUntARkfDcdb7ra5ec&usqp=CAU" alt="Locate" />
  </button>

  <div id="map"></div>

  <script>
    let map;
    let userLocation;
    let userMarker;
    let userCircle;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: { lat: 0, lng: 0 },
      });

      locateUser(true);
    }

    function locateUser(fetchHospitals = false) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
          };

          map.setCenter(userLocation);

          if (userMarker) userMarker.setMap(null);
          if (userCircle) userCircle.setMap(null);

          userMarker = new google.maps.Marker({
            map: map,
            position: userLocation,
            title: "Your Location",
            icon: {
              url: "https://www.freeiconspng.com/uploads/blue-location-icon-png-19.png",
              scaledSize: new google.maps.Size(30, 30)
            }
          });

          userCircle = new google.maps.Circle({
            strokeColor: "#1d4ed8",
            strokeOpacity: 0.8,
            strokeWeight: 2,
            fillColor: "#1d4ed8",
            fillOpacity: 0.2,
            map,
            center: userLocation,
            radius: 200,
          });

          if (fetchHospitals) {
            findHospitals();
          }
        }, () => {
          alert("Geolocation permission denied.");
        });
      } else {
        alert("Geolocation not supported by this browser.");
      }
    }

    function findHospitals() {
      const service = new google.maps.places.PlacesService(map);
      service.textSearch({
        query: "hospital",
        location: userLocation,
        radius: 50000
      }, (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK) {
          results.forEach(place => {
            const marker = new google.maps.Marker({
              map: map,
              position: place.geometry.location,
              title: place.name,
              icon: {
                url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdGu04axn9vlZ-abhl8Vxpj4nxb7Q0-aTc0A&s",
                scaledSize: new google.maps.Size(30, 30)
              }
            });

            const infoWindow = new google.maps.InfoWindow();

            const distanceService = new google.maps.DistanceMatrixService();
            distanceService.getDistanceMatrix({
              origins: [userLocation],
              destinations: [place.geometry.location],
              travelMode: 'DRIVING',
            }, (response, status) => {
              if (status === 'OK') {
                const distance = response.rows[0].elements[0].distance.text;
                const duration = response.rows[0].elements[0].duration.text;

                marker.addListener('click', () => {
                  infoWindow.setContent(`
                    <strong>${place.name}</strong><br>
                    ${place.formatted_address || place.vicinity || ''}<br>
                    Distance: ${distance}<br>
                    Time: ${duration}<br>
                    <a href="https://www.google.com/maps/dir/?api=1&origin=${userLocation.lat},${userLocation.lng}&destination=${place.geometry.location.lat()},${place.geometry.location.lng()}" target="_blank">Show Directions</a>
                  `);
                  infoWindow.open(map, marker);
                });
              }
            });
          });
        } else {
          alert("No hospitals found.");
        }
      });
    }

    document.getElementById("locateBtn").addEventListener("click", () => {
      locateUser(false);
    });
  </script>

  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDmJE1ZIwY2k6Nd2u7vTaQj0nAGEkP-DgA&libraries=places&callback=initMap">
  </script>
